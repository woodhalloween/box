# YOLO単体 vs ByteTrack ID付与比較実装　具体化YAML定義書

project:
  name: "YOLO_ByteTrack_ID_Comparison"
  description: "YOLO単体のID付与とByteTrackでのID付与の比較実装"
  version: "1.0.0"
  
  input_data:
    test_video: "data/test_video.mp4"
    model_weights:
      yolo11n: "yolo11n.pt" 
      yolo11n_pose: "yolo11n-pose.pt"

architecture:
  comparison_methods:
    yolo_simple_id:
      description: "YOLO単体での簡単なID付与（位置ベース）"
      class_name: "YoloSimpleTracker"
      parameters:
        distance_threshold: 50
        max_disappeared_frames: 10
        
    yolo_advanced_id:
      description: "YOLO単体での高度なID付与（特徴量マッチング）"
      class_name: "YoloAdvancedTracker"
      parameters:
        appearance_weight: 0.3
        position_weight: 0.7
        iou_threshold: 0.3
        feature_dim: 128
        
    bytetrack_id:
      description: "ByteTrackによるID付与"
      class_name: "ByteTrackWrapper"
      parameters:
        track_thresh: 0.5
        track_buffer: 30
        match_thresh: 0.8

components:
  base_detection:
    model_path: "yolo11n.pt"
    confidence_threshold: 0.3
    classes: [0]  # person only
    device: ""  # auto-detect
    
  evaluation:
    metrics:
      accuracy:
        identity_consistency: true
        identity_switches: true
        fragmentation_rate: true
      performance:
        processing_time_ms: true
        memory_usage_mb: true
        fps: true
      reliability:
        tracking_stability: true
        occlusion_handling: true
        reidentification_rate: true
        
    test_duration: 60  # seconds
    ground_truth_required: false
    
output_configuration:
  video_output:
    enabled: true
    codec: "mp4v"
    fps: 30
    output_path: "comparison/output/comparison_video.mp4"
    display_elements:
      - id_number
      - confidence
      - method_type
      - bounding_box
      
  logging:
    comparison_log:
      path: "comparison/output/comparison_results.csv"
      enabled: true
      real_time: true
      
    performance_summary:
      path: "comparison/output/performance_summary.json"
      enabled: true
      
    detailed_metrics:
      path: "comparison/output/detailed_metrics.csv"
      enabled: true

directory_structure:
  base_dir: "comparison"
  subdirs:
    - "id_methods"
    - "evaluators"
    - "utils"
    - "config"
    - "output"

implementation_files:
  core:
    main_comparison: "comparison/main_comparison.py"
    yolo_simple_tracker: "comparison/id_methods/yolo_simple_tracker.py"
    yolo_advanced_tracker: "comparison/id_methods/yolo_advanced_tracker.py"
    bytetrack_wrapper: "comparison/id_methods/bytetrack_wrapper.py"
    comparison_evaluator: "comparison/evaluators/comparison_evaluator.py"
    visualization: "comparison/utils/visualization.py"
    metrics: "comparison/utils/metrics.py"
    
  config:
    config_file: "comparison/config/comparison_config.yaml"
    
  dependencies:
    requirements: "requirements.txt"

runtime_parameters:
  video_processing:
    frame_rate: 30
    batch_size: 1
    max_frames: 1800  # 60 seconds at 30fps
    
  memory_optimization:
    enable_gpu: true
    max_memory_usage: "2GB"
    clear_cache_interval: 100  # frames
    
  display:
    show_preview: true
    preview_scale: 0.5
    update_interval: 1  # frames

test_scenarios:
  single_person:
    description: "一人の人物の追跡テスト"
    expected_objects: 1
    duration: 30
    
  multiple_persons:
    description: "複数人物の追跡テスト"
    expected_objects: "2-5"
    duration: 60
    
  occlusion_scenario:
    description: "遮蔽発生時の追跡テスト"
    expected_occlusions: "1-3"
    duration: 45
    
  crowded_scene:
    description: "混雑シーンでの追跡テスト"
    expected_objects: "5+"
    duration: 60

performance_targets:
  minimum_fps: 15
  maximum_memory: "1GB"
  maximum_processing_time: "50ms/frame"
  target_accuracy: "85%"

error_handling:
  video_load_failure: "skip_and_log"
  model_load_failure: "abort_with_error"
  tracking_failure: "continue_with_warning"
  memory_overflow: "reduce_batch_size"

logging_configuration:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: "comparison/output/comparison.log"
  console: true 