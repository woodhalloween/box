# .pre-commit-config.yaml
# Generated by Daisy — structural enforcement agent

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4  # Use latest compatible stable version
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]  # Autofix lint errors
      - id: ruff-format
        name: Ruff Formatter
        args: []

