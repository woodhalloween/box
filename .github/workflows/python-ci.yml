# .github/workflows/python-ci.yml
# Force update: 2024-08-28

name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry via curl
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: 📦 Install dependencies
        run: poetry install

      - name: 🔍 Ruff lint
        run: poetry run ruff check .

      - name: 🎨 Ruff format check
        run: poetry run ruff format --check .

      - name: 🔧 Run Pre-Commit Hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  test:
    name: Run tests with pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry via curl
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: 📦 Install dependencies
        run: poetry install

      - name: 🧱 Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxrender1 libxext6 libgl1

      - name: 🕵️ List installed packages for debugging
        run: poetry run pip list

      - name: 🧪 Collect test metadata (check import errors)
        run: |
          if [ -d "tests" ]; then
            poetry run pytest --collect-only
          else
            echo "✅ No tests to collect: 'tests/' directory not found."
          fi

      - name: 🧪 Run pytest
        run: |
          if [ -d "tests" ]; then
            poetry run pytest
          else
            echo "✅ No tests to run: 'tests/' directory not found."
          fi
