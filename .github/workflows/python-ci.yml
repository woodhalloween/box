# .github/workflows/python-ci.yml

name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry via curl
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: 📦 Install dependencies
        run: poetry install --with dev

      - name: 🔍 Ruff lint
        run: poetry run ruff check .

      - name: 🎨 Ruff format check
        run: poetry run ruff format --check .

  test:
    name: Run tests with pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry via curl
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: 📦 Install dependencies
        run: poetry install --with dev

      - name: 🧪 Collect test metadata (check import errors)
        run: |
          if [ -d "tests" ]; then
            poetry run pytest --collect-only
          else
            echo "✅ No tests to collect: 'tests/' directory not found."
          fi

      - name: 🧪 Run pytest
        run: |
          if [ -d "tests" ]; then
            poetry run pytest
          else
            echo "✅ No tests to run: 'tests/' directory not found."
          fi
